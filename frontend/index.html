<!DOCTYPE html>
<html lang="fr" class="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Natty</title>

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Icônes Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <!-- Config Tailwind custom -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#30520e", // Dark Green
              secondary: "#2eab4b", // Bright Green
              accent: "#ffeda8", // Yellow
              warning: "#e97407", // Orange
              "background-light": "#F7F8FC",
              "background-dark": "#101419",
              "text-light": "#111827",
              "text-dark": "#E2E8F0",
              "card-light": "#FFFFFF",
              "card-dark": "#1A202C",
            },
            fontFamily: {
              display: ["Lexend", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "1.5rem",
              xl: "2rem",
              full: "9999px",
            },
            animation: {
              "slow-pan": "pan 20s ease-in-out infinite alternate",
            },
            keyframes: {
              pan: {
                "0%": { transform: "scale(1.1) translate(0%, 0%)" },
                "100%": { transform: "scale(1.25) translate(-5%, -2%)" },
              },
            },
          },
        },
      };
    </script>

    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }

      .material-symbols-outlined.filled {
        font-variation-settings: "FILL" 1;
      }

      body {
        min-height: 100vh;
        background-color: #f7f8fc;
        /* Mobile optimization */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /* Disable text selection pour effet app */
      .select-none {
        user-select: none;
        -webkit-user-select: none;
      }

      /* Hide scrollbar pour les carrousels */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="font-display text-text-light dark:text-text-dark bg-background-light dark:bg-background-dark overflow-hidden select-none"
  >
    <div id="root"></div>
    <!-- Point d’entrée Vite/React -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
